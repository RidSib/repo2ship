<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repo2Ship — Control Center</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #111827;
      --border: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --success: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem;
    }
    .container { max-width: 980px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    .badge {
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
    }
    .stat-label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; }
    .stat-value { font-size: 1.65rem; font-weight: 700; margin-top: 0.35rem; }
    .stat-card.has-critical {
      border-color: var(--danger);
      box-shadow: 0 0 0 1px var(--danger) inset;
    }
    .stat-card.has-critical .stat-value { color: var(--danger); }
    .controls {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      background: var(--panel);
      padding: 1rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
    }
    input, select, button {
      background: #1f2937;
      color: var(--text);
      border: 1px solid #374151;
      border-radius: 0.5rem;
      padding: 0.55rem 0.85rem;
      font-size: 0.9rem;
    }
    input { flex: 1; }
    button {
      background: var(--accent);
      color: #030712;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .task-list { display: flex; flex-direction: column; gap: 0.65rem; }
    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.65rem;
      padding: 0.85rem 1.1rem;
    }
    .task-item.done .task-title {
      text-decoration: line-through;
      color: var(--muted);
    }
    .priority-pill {
      font-size: 0.75rem;
      padding: 0.2rem 0.55rem;
      border-radius: 0.35rem;
      text-transform: uppercase;
      font-weight: 700;
      margin-right: 0.65rem;
    }
    .priority-critical { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .priority-high { background: rgba(245, 158, 11, 0.2); color: var(--warn); }
    .priority-medium { background: rgba(56, 189, 248, 0.2); color: var(--accent); }
    .priority-low { background: rgba(156, 163, 175, 0.2); color: var(--muted); }
    .progress-footer {
      margin-top: 1rem;
      padding: 0.85rem 1.1rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.65rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1 style="margin: 0; font-size: 1.45rem;">Agentic Sprint & Issue Queue</h1>
        <p data-testid="header-subtitle" style="margin: 0.3rem 0 0; color: var(--muted); font-size: 0.9rem;">
          GitHub Actions + Pi / OpenCode + Your Model Provider + Langfuse
        </p>
      </div>
      <span class="badge" data-testid="stack-badge">Agent Pipeline Ready</span>
    </header>

    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Tasks</div>
        <div class="stat-value" id="stat-total" data-testid="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completed</div>
        <div class="stat-value" id="stat-completed" data-testid="stat-completed">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completion Rate</div>
        <div class="stat-value" id="stat-rate" data-testid="stat-rate">0%</div>
      </div>
      <div class="stat-card" id="stat-critical-card" data-testid="stat-critical-card">
        <div class="stat-label">Critical Open</div>
        <div class="stat-value" id="stat-critical" data-testid="stat-critical">0</div>
      </div>
    </section>

    <form id="task-form" class="controls">
      <input
        id="task-title-input"
        data-testid="task-title-input"
        aria-label="New task title"
        type="text"
        placeholder="Add new issue or agent task (e.g., Fix checkout empty coupon crash)..."
        required
      />
      <select id="task-priority-select" data-testid="task-priority-select" aria-label="Task priority">
        <option value="medium">Medium</option>
        <option value="high">High</option>
        <option value="critical">Critical</option>
        <option value="low">Low</option>
      </select>
      <button type="submit" data-testid="add-task-btn">Queue Task</button>
      <button type="button" data-testid="clear-completed-btn">Clear completed</button>
    </form>

    <div id="task-list" class="task-list" data-testid="task-list"></div>
    <div class="progress-footer" data-testid="progress-footer" role="status" aria-live="polite"></div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
